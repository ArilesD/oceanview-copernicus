{% extends 'base.html' %}
 
{% block content %}
<div class="reviews-container">
<div class="review-form-card">
<h2><i class="fas fa-paper-plane"></i> Contactez-nous</h2>
<p>Que pensez-vous de notre site ? Votre avis sera envoyé directement à notre équipe.</p>
 
        {% if session.get('user_id') %}
<form method="POST" action="/reviews">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="star-rating">
<input type="radio" id="star5" name="note" value="5" required /><label for="star5" title="Excellent"></label>
<input type="radio" id="star4" name="note" value="4" /><label for="star4" title="Très bien"></label>
<input type="radio" id="star3" name="note" value="3" /><label for="star3" title="Bien"></label>
<input type="radio" id="star2" name="note" value="2" /><label for="star2" title="Moyen"></label>
<input type="radio" id="star1" name="note" value="1" /><label for="star1" title="Mauvais"></label>
</div>
 
            <textarea name="message" placeholder="Écrivez votre message ici..." required></textarea>
<button type="submit" class="btn-submit-review">Envoyer mon avis <i class="fas fa-envelope"></i></button>
</form>
        {% else %}
<div class="login-alert">
<p>Vous devez être connecté pour nous envoyer un avis.</p>
<a href="{{ url_for('auth.login') }}" class="btn-login-small">Se connecter</a>
</div>
        {% endif %}
</div>
 
</div>
{% endblock %}
